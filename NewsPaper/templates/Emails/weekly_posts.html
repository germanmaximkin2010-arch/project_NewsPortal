<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Посты за неделю</title>
</head>
<body>
Здравствуйте, {{ username }},
<br>
Присылаем вам список постов за прошедшую неделю,
<br>
в категориях, на которые вы подписаны.
<ul>
    {% for post in posts %}
        <li>
            <a href="{{ link }}{{ post.get_absolute_url }}">{{ post.title }}</a>
        </li>
    {% endfor %}
</ul>
</body>
</html>
