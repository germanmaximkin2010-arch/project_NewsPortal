{% extends 'flatpages/default.html' %}

{% block content %}
    <h2>Страница авторизованного пользователя {{ request.user.username }}</h2>
    <div> Здесь может содержаться персональная информация для каждого пользователя</div>
    <div class="mt-3">
        {% if not is_author %}
            <a href="{% url 'new_author' %}" class="btn btn-outline-primary mt-3">Стать автором</a>
        {% endif %}
        <a href="{% url 'account_logout' %}" class="btn btn-danger mt-4">Выйти</a>
    </div>
{% endblock %}
